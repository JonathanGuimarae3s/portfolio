<div>
  <header>
    <h2 mat-dialog-title>{{ getData()?.title }}</h2>

    <button (click)="closeModal()">
      <img src="assets/icons/dialog/close.svg" alt="Botão para fechar o dialog" />
    </button>
  </header>

  <mat-dialog-content>
    <p style="color: black;" [innerHTML]="getData()?.periodo"></p>

    <h3>Descrição</h3>
    <article [innerHTML]="getData()?.description"></article>
    <h3>Competências</h3>
    <ul>
      @for (item of getData()?.knowledge; track item) {
  
      <li>
        <img
          [src]="item.src"
          [alt]="item.alt"
          loading=""
          width="100%"
  
        />
      </li>
      }
    </ul>

    <article [innerHTML]="getData()?.tecnologies"></article>
    <!-- <nav>
      @for(item of getData()?.links; track item){
      <a [href]="item.href" target="_blank" class="btn btn-primary">
        {{ item.name }}
      </a>
      }
    </nav> -->
  </mat-dialog-content>
</div>
